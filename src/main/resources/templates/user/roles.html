<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles del usuario</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/users.css}">
</head>
<body class="users-page">
<main class="users-card narrow">
    <header class="users-header">
        <div>
            <h1 class="users-title" th:text="${user.username}">usuario</h1>
            <p class="users-meta">Selecciona los roles que tendrá este usuario.</p>
        </div>
    </header>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>

    <form method="post" th:action="@{/user/{id}/roles(id=${user.id})}">
        <ul class="check-list">
            <li th:each="role : ${roles}">
                <label class="check-item">
                    <input class="check-input"
                           type="checkbox"
                           name="roleIds"
                           th:value="${role.id}"
                           th:checked="${#lists.contains(assignedRoleIds, role.id)}">
                    <span class="check-label" th:text="${role.name}">ROLE_ADMIN</span>
                </label>
            </li>
            <li class="text-muted" th:if="${#lists.isEmpty(roles)}">No hay roles creados.</li>
        </ul>

        <footer class="users-footer actions">
            <a class="btn btn-outline" th:href="@{/user}">Volver a usuarios</a>
            <button class="btn btn-primary" type="submit">Guardar roles</button>
        </footer>
    </form>
</main>
</body>
</html>
